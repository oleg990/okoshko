services:
  postgres:
    image: postgres:16-alpine
    container_name: okoshko-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-okoshko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-okoshko}
    ports:
      # Слушаем только localhost: база не должна быть видна из сети
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-okoshko} -d ${POSTGRES_DB:-okoshko}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
